  <path class="flow" d="M960 55 C1290 55 1450 115 1450 619"/>

  <!-- Application and registry -->
  <rect class="node" x="640" y="18" width="320" height="70"/>
  <text class="title" x="800" y="47" text-anchor="middle">app.py</text>
  <text class="small" x="800" y="71" text-anchor="middle">Streamlit UI — field-type selector, tabbed dashboard</text>
  <rect class="node" x="630" y="126" width="340" height="80"/>
  <text class="title" x="800" y="155" text-anchor="middle">FieldTypeRegistry</text>
  <text class="small" x="800" y="179" text-anchor="middle">registry.py — dispatches detector / methodology metadata</text>

  <!-- Rice AWD path -->
  <rect x="30" y="194" width="145" height="27" rx="4" fill="#FFFFFF"/>
  <text class="section" x="40" y="215">RICE AWD PATH</text>
  <rect class="rice" x="40" y="230" width="260" height="56"/>
  <text class="body" x="170" y="264" text-anchor="middle">rice_awd (uses_sar = True)</text>
  <rect class="rice" x="40" y="320" width="300" height="115"/>
  <text class="title" x="190" y="347" text-anchor="middle">SpatialDataEngine /</text>
  <text class="title" x="190" y="370" text-anchor="middle">AdaptiveAWDGate</text>
  <text class="small" x="190" y="397" text-anchor="middle">Sentinel-1 retrieval and smoothing</text>
  <text class="small" x="190" y="419" text-anchor="middle">AWD flood / drydown / phenology detection</text>
  <rect class="rice" x="355" y="335" width="280" height="80"/>
  <text class="title" x="495" y="365" text-anchor="middle">CarbonAssetEngine</text>
  <text class="small" x="495" y="391" text-anchor="middle">VM0051 QA3 credit calculation</text>
  <rect class="rice" x="355" y="460" width="280" height="115"/>
  <text class="title" x="495" y="489" text-anchor="middle">AI Detection Pipeline</text>
  <text class="small" x="495" y="514" text-anchor="middle">DatasetBuilder • FeatureEngineer</text>
  <text class="tiny" x="495" y="536" text-anchor="middle">ModelRegistry • AWDPredictor • ModelEvaluator</text>
  <text class="small" x="495" y="558" text-anchor="middle">optional classifier with rule fallback</text>
  <ellipse class="external" cx="242" cy="520" rx="70" ry="60"/>
  <text class="externalText" x="242" y="512" text-anchor="middle">Google Earth</text>
  <text class="externalText" x="242" y="535" text-anchor="middle">Engine</text>

  <!-- Cropland ALM path -->
  <rect x="918" y="194" width="190" height="27" rx="4" fill="#FFFFFF"/>
  <text class="section" x="930" y="215">CROPLAND ALM PATH</text>
  <rect class="alm" x="920" y="230" width="280" height="56"/>
  <text class="body" x="1060" y="254" text-anchor="middle">cropland_alm_vm0042</text>
  <text class="small" x="1060" y="276" text-anchor="middle">(uses_sar = False)</text>
  <rect class="alm" x="890" y="320" width="340" height="115"/>
  <text class="title" x="1060" y="347" text-anchor="middle">AlmPracticeValidator /</text>
  <text class="title" x="1060" y="370" text-anchor="middle">AlmCarbonEngine</text>
  <text class="small" x="1060" y="397" text-anchor="middle">practice / livestock / SOC completeness checks</text>
  <text class="small" x="1060" y="419" text-anchor="middle">VM0042 credit calculation</text>
  <rect class="alm" x="690" y="485" width="270" height="90"/>
  <text class="title" x="825" y="515" text-anchor="middle">Practice &amp; Soil Data Tab</text>
  <text class="small" x="825" y="541" text-anchor="middle">fertilizer • tillage • residue</text>
  <text class="small" x="825" y="562" text-anchor="middle">lab SOC samples</text>
  <rect class="alm" x="995" y="485" width="270" height="90"/>
  <text class="body" x="1130" y="515" text-anchor="middle">Livestock Schedule Persistence</text>
  <text class="small" x="1130" y="541" text-anchor="middle">alm_livestock_schedule</text>
  <text class="tiny" x="1130" y="563" text-anchor="middle">enteric-fermentation &amp; pasture-manure terms</text>
  <rect class="alm" x="1300" y="485" width="270" height="90"/>
  <text class="title" x="1435" y="515" text-anchor="middle">Leakage Screening</text>
  <text class="small" x="1435" y="541" text-anchor="middle">production-decline screen</text>
  <text class="small" x="1435" y="562" text-anchor="middle">baseline vs. project yield</text>

  <!-- Shared services and outputs -->
  <rect x="28" y="603" width="250" height="28" rx="4" fill="#FFFFFF"/>
  <text class="section" x="40" y="625">SHARED SERVICES AND OUTPUTS</text>
  <rect class="shared" x="30" y="640" width="280" height="100"/>
  <text class="title" x="170" y="670" text-anchor="middle">GeoUtils, ProjectStore</text>
  <text class="small" x="170" y="696" text-anchor="middle">boundary parsing / area computation</text>
  <text class="small" x="170" y="718" text-anchor="middle">SQLite persistence for both paths</text>
  <rect class="shared" x="340" y="640" width="305" height="100"/>
  <text class="title" x="493" y="670" text-anchor="middle">ReportGenerator</text>
  <text class="small" x="493" y="696" text-anchor="middle">PDF / JSON export for both paths</text>
  <text class="small" x="493" y="718" text-anchor="middle">CSV currently limited to practice / SOC data</text>
  <ellipse class="external" cx="715" cy="690" rx="85" ry="66"/>
  <text class="externalText" x="715" y="682" text-anchor="middle">Model Artifacts</text>
  <text class="externalText" x="715" y="706" text-anchor="middle">data/ai_models/*.joblib</text>
  <rect class="shared" x="840" y="640" width="350" height="100"/>
  <text class="title" x="1015" y="670" text-anchor="middle">Credit History Persistence</text>
  <text class="small" x="1015" y="696" text-anchor="middle">credit_history: inputs + final issuance</text>
  <text class="small" x="1015" y="718" text-anchor="middle">stored for every calculation run</text>
  <rect class="shared" x="1320" y="620" width="250" height="100"/>
  <text class="title" x="1445" y="650" text-anchor="middle">Field Info Update</text>
  <text class="small" x="1445" y="676" text-anchor="middle">edit name / district</text>
  <text class="small" x="1445" y="698" text-anchor="middle">geometry &amp; field_type immutable</text>
  <ellipse class="external" cx="485" cy="825" rx="85" ry="53"/>
  <text class="externalText" x="485" y="817" text-anchor="middle">Browser Download</text>
  <text class="externalText" x="485" y="840" text-anchor="middle">st.download_button</text>
  <rect class="shared" x="800" y="790" width="270" height="70"/>
  <text class="title" x="935" y="819" text-anchor="middle">Portfolio Summary</text>
  <text class="small" x="935" y="843" text-anchor="middle">cross-field totals by methodology path</text>
  <ellipse class="external" cx="1390" cy="825" rx="90" ry="63"/>
  <text class="externalText" x="1390" y="817" text-anchor="middle">SQLite</text>
  <text class="externalText" x="1390" y="841" text-anchor="middle">data/project_store.db</text>
</svg>
