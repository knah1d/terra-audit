  <path class="flow" d="M1060 435 C1010 456 875 461 825 484"/>
  <path class="flow" d="M1060 435 L1130 484"/>
  <path class="flow" d="M1170 435 C1270 452 1370 461 1435 484"/>
  <path class="flow" d="M435 575 C360 599 245 612 170 639"/>
  <path class="flow" d="M495 575 C505 600 500 613 493 639"/>
  <path class="dependency" d="M545 575 C575 610 605 650 631 674"/>
  <path class="flow" d="M635 529 C730 556 875 598 930 639"/>
  <path class="flow" d="M825 575 C755 598 635 612 560 639"/>
  <path class="flow" d="M1130 575 L1030 639"/>
  <path class="flow" d="M1435 575 C1365 600 1245 614 1160 639"/>
  <path class="flow" d="M1015 739 C990 760 960 774 935 789"/>
  <path class="dependency" d="M493 739 C493 752 490 763 485 772"/>
  <path class="dependency" d="M170 739 C350 785 1110 815 1299 815"/>
