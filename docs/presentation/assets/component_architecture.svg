<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 Z" fill="#46534B"/></marker>
    <style>
      .node { fill:#FFFFFF; stroke:#66796D; stroke-width:2; rx:8; }
      .rice { fill:#EDF5EA; stroke:#2F6B3B; stroke-width:2.4; rx:8; }
      .alm { fill:#F5F3E8; stroke:#6F7D43; stroke-width:2.4; rx:8; }
      .shared { fill:#EAF1EC; stroke:#527A68; stroke-width:2.2; rx:8; }
      .external { fill:#FFFDFC; stroke:#C6534F; stroke-width:2; stroke-dasharray:8 6; }
      .flow { fill:none; stroke:#46534B; stroke-width:2.1; marker-end:url(#arrow); }
      .dependency { fill:none; stroke:#65746B; stroke-width:1.9; stroke-dasharray:7 6; marker-end:url(#arrow); }
      .title { font-family:Cambria,"Times New Roman",serif; font-size:18px; font-weight:700; fill:#173B29; }
      .body { font-family:Cambria,"Times New Roman",serif; font-size:15px; fill:#193A2B; }
      .small { font-family:Cambria,"Times New Roman",serif; font-size:13px; fill:#425349; }
      .tiny { font-family:Cambria,"Times New Roman",serif; font-size:11.5px; fill:#425349; }
      .externalText { font-family:Cambria,"Times New Roman",serif; font-size:15px; fill:#C63F3B; }
      .section { font-family:Cambria,"Times New Roman",serif; font-size:12.5px; font-weight:700; letter-spacing:1px; fill:#5F6D63; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <!-- Relationships -->
  <path class="flow" d="M800 88 L800 126"/>
  <path class="flow" d="M630 166 C465 166 300 187 170 229"/>
