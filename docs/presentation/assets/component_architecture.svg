  <path class="flow" d="M170 286 L170 319"/>
  <path class="flow" d="M340 378 L354 378"/>
  <path class="flow" d="M495 415 L495 459"/>
  <path class="dependency" d="M205 435 C210 447 225 452 242 459"/>
