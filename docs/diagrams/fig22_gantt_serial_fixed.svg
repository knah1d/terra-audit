    <text transform="translate(844 1098) rotate(-35)">01 Jun</text>
    <text transform="translate(991 1098) rotate(-35)">15 Jun</text>
    <text transform="translate(1137 1098) rotate(-35)">29 Jun</text>
    <text transform="translate(1283 1098) rotate(-35)">13 Jul</text>
    <text transform="translate(1429 1098) rotate(-35)">27 Jul</text>
    <text transform="translate(1576 1098) rotate(-35)">10 Aug</text>
    <text transform="translate(1722 1098) rotate(-35)">24 Aug</text>
    <text transform="translate(1868 1098) rotate(-35)">07 Sep</text>
